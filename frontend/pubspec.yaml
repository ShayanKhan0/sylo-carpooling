name: sylo
description: A professional carpooling application with modern UI

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animations
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^13.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4

  # Google Maps
  google_maps_flutter: ^2.10.0
  google_maps_flutter_web: ^0.5.10
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.1.0
  uuid: ^4.5.1

  # Camera & Image
  image_picker: ^1.0.7

  # Video
  video_player: ^2.9.2

  # Push Notifications
  firebase_messaging: ^16.1.1

  # WebSocket for real-time
  web_socket_channel: ^3.0.1

  # File & Downloads
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.2.2
  pointer_interceptor: ^0.10.1+2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/videos/

  shaders:
    - shaders/auth_minimal.frag
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
